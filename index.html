<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#142523">
	<title>Updraft — Keep it going</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #142523;
			--muted: #75817a;
			--paper: #f4f3e9;
			--lime: #d3f36b;
			--coral: #ff8064;
			--teal: #83e4cf;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding: 28px 20px 24px;
			background-color: var(--paper);
			background-image: radial-gradient(#14252312 0.8px, transparent 0.8px);
			background-size: 16px 16px;
			color: var(--ink);
			font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
		}

		.game {
			width: min(100%, 760px);
			margin: 0 auto;
		}

		.topline, .brand, .scoreboard, .score, .actions, .bottomline {
			display: flex;
			align-items: center;
		}

		.topline, .bottomline { justify-content: space-between; }
		.brand { gap: 10px; }

		.mark {
			display: grid;
			width: 34px;
			height: 34px;
			place-items: center;
			border-radius: 50%;
			background: var(--coral);
			color: var(--ink);
			font-size: 19px;
			font-weight: 900;
			transform: rotate(-10deg);
		}

		.wordmark {
			font-size: 14px;
			font-weight: 900;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.edition {
			color: var(--muted);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			margin: 28px 0 5px;
			font-size: clamp(34px, 7vw, 54px);
			line-height: 0.98;
			letter-spacing: -0.045em;
		}

		.subtitle {
			margin: 0 0 24px;
			color: #53625c;
			font-size: 14px;
		}

		.scoreboard {
			min-height: 76px;
			justify-content: space-between;
			gap: 18px;
			padding: 12px 2px 16px;
		}

		.score { gap: 13px; }

		.score-value {
			min-width: 88px;
			font-size: 42px;
			font-weight: 900;
			line-height: 1;
			font-variant-numeric: tabular-nums;
		}

		.score-label, .best-label {
			color: var(--muted);
			font-size: 10px;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.best {
			padding-left: 16px;
			border-left: 1px solid #14252320;
		}

		.best-value {
			display: block;
			margin-top: 4px;
			font-size: 17px;
			font-weight: 900;
			font-variant-numeric: tabular-nums;
		}

		.actions { gap: 8px; }

		button {
			min-height: 40px;
			padding: 0 14px;
			border: 1.5px solid var(--ink);
			border-radius: 4px;
			background: var(--paper);
			color: var(--ink);
			cursor: pointer;
			font: inherit;
			font-size: 12px;
			font-weight: 900;
			transition: transform 120ms ease, background 120ms ease;
		}

		button:hover { transform: translateY(-2px); }
		button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
		button.primary { background: var(--lime); }

		.board {
			position: relative;
			overflow: hidden;
			width: 100%;
			aspect-ratio: 1.46;
			min-height: 250px;
			border: 2px solid var(--ink);
			border-radius: 5px;
			background: #17332e;
			box-shadow: 6px 6px 0 var(--ink);
			touch-action: none;
		}

		canvas { display: block; width: 100%; height: 100%; }

		.bottomline {
			gap: 12px;
			padding: 17px 2px 0;
			color: #53625c;
			font-size: 11px;
		}

		.keys { display: flex; align-items: center; gap: 5px; }

		kbd {
			display: inline-grid;
			min-width: 22px;
			height: 22px;
			padding: 0 5px;
			place-items: center;
			border: 1px solid #14252340;
			border-radius: 3px;
			background: #fffdf5;
			color: var(--ink);
			font-family: inherit;
			font-size: 10px;
			font-weight: 700;
		}

		@media (max-width: 500px) {
			body { padding: 20px 15px; }
			.edition { font-size: 9px; }
			h1 { margin-top: 24px; }
			.scoreboard { gap: 8px; }
			.score { gap: 8px; }
			.score-value { min-width: 66px; font-size: 34px; }
			.best { padding-left: 10px; }
			.actions { gap: 5px; }
			button { min-height: 38px; padding: 0 9px; font-size: 11px; }
			.bottomline { align-items: flex-start; font-size: 10px; }
			.keys { flex-wrap: wrap; justify-content: flex-end; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="game">
		<header class="topline">
			<div class="brand"><span class="mark" aria-hidden="true">↑</span><span class="wordmark">Updraft</span></div>
			<span class="edition">A tiny keep-it-up game</span>
		</header>

		<h1>Keep it<br>in the air.</h1>
		<p class="subtitle">A little paddle. A very bouncy ball. How long can you last?</p>

		<section class="scoreboard" aria-label="Game score">
			<div class="score">
				<span class="score-value" id="score">0</span>
				<span class="score-label">points</span>
			</div>
			<div class="best">
				<span class="best-label">Personal best</span>
				<span class="best-value" id="best">0</span>
			</div>
			<div class="actions">
				<button class="primary" id="play" type="button">Start</button>
				<button id="reset" type="button" aria-label="Reset game">Reset</button>
			</div>
		</section>

		<div class="board" id="board">
			<canvas id="field" aria-label="Game area. Move the paddle to bounce the ball."></canvas>
		</div>

		<footer class="bottomline">
			<span id="status" aria-live="polite">Press Start to serve.</span>
			<span class="keys" aria-label="Controls">
				<span>Move</span><kbd>←</kbd><kbd>→</kbd><span>or</span><kbd>A</kbd><kbd>D</kbd><span>·</span><span>Mouse / touch</span>
			</span>
		</footer>
	</main>

	<script>
		const canvas = document.querySelector("#field");
		const board = document.querySelector("#board");
		const context = canvas.getContext("2d");
		const scoreText = document.querySelector("#score");
		const bestText = document.querySelector("#best");
		const statusText = document.querySelector("#status");
		const playButton = document.querySelector("#play");
		const paddle = { x: 0, width: 104, height: 12, y: 0, speed: 8 };
		const ball = { x: 0, y: 0, radius: 9, vx: 0, vy: 0 };
		const keys = new Set();
		let width = 0;
		let height = 0;
		let state = "ready";
		let startedAt = 0;
		let score = 0;
		let best = Number(localStorage.getItem("updraft-best") || 0);
		let previousFrame = 0;

		bestText.textContent = best;

		function resize() {
			const bounds = board.getBoundingClientRect();
			const pixelRatio = window.devicePixelRatio || 1;
			width = bounds.width;
			height = bounds.height;
			canvas.width = Math.round(width * pixelRatio);
			canvas.height = Math.round(height * pixelRatio);
			context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
			paddle.width = Math.min(104, width * 0.24);
			paddle.y = height - 34;
			paddle.x = Math.max(paddle.width / 2, Math.min(width - paddle.width / 2, paddle.x || width / 2));
			if (state !== "running") {
				ball.x = width / 2;
				ball.y = height * 0.47;
			}
			draw();
		}

		function draw() {
			context.clearRect(0, 0, width, height);
			context.fillStyle = "#17332e";
			context.fillRect(0, 0, width, height);

			context.save();
			context.strokeStyle = "#ffffff12";
			context.lineWidth = 1;
			context.setLineDash([3, 8]);
			context.beginPath();
			context.moveTo(18, 20);
			context.lineTo(width - 18, 20);
			context.stroke();
			context.restore();

			context.fillStyle = "#83e4cf";
			context.beginPath();
			context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
			context.fill();
			context.fillStyle = "#d3f36b";
			context.beginPath();
			context.roundRect(paddle.x - paddle.width / 2, paddle.y, paddle.width, paddle.height, 6);
			context.fill();

			if (state !== "running") {
				const title = state === "over" ? "NICE RUN" : state === "paused" ? "PAUSED" : "READY?";
				const hint = state === "over" ? `YOU SCORED ${score}` : state === "paused" ? "PRESS SPACE TO CONTINUE" : "PRESS START OR SPACE TO SERVE";
				context.textAlign = "center";
				context.fillStyle = "#f4f3e9";
				context.font = "800 12px Trebuchet MS, sans-serif";
				context.fillText(title, width / 2, height * 0.35);
				context.fillStyle = "#83e4cf";
				context.font = "700 10px Trebuchet MS, sans-serif";
				context.fillText(hint, width / 2, height * 0.35 + 19);
			}
		}

		function begin() {
			if (state === "running") return;
			if (state !== "paused") {
				score = 0;
				scoreText.textContent = score;
				ball.x = width / 2;
				ball.y = height * 0.47;
				const direction = Math.random() < 0.5 ? -1 : 1;
				ball.vx = direction * 3.2;
				ball.vy = 4.2;
				startedAt = performance.now();
			} else {
				startedAt = performance.now() - score * 100;
			}
			state = "running";
			playButton.textContent = "Pause";
			statusText.textContent = "Keep it up!";
		}

		function end() {
			state = "over";
			score = Math.floor((performance.now() - startedAt) / 100);
			scoreText.textContent = score;
			if (score > best) {
				best = score;
				bestText.textContent = best;
				localStorage.setItem("updraft-best", best);
				statusText.textContent = "New personal best. One more?";
			} else {
				statusText.textContent = "Ball down. Give it another go?";
			}
			playButton.textContent = "Play again";
		}

		function reset() {
			state = "ready";
			score = 0;
			scoreText.textContent = score;
			playButton.textContent = "Start";
			statusText.textContent = "Press Start to serve.";
			ball.x = width / 2;
			ball.y = height * 0.47;
			draw();
		}

		function movePaddle(clientX) {
			const bounds = board.getBoundingClientRect();
			paddle.x = Math.max(paddle.width / 2, Math.min(width - paddle.width / 2, clientX - bounds.left));
			if (state !== "running") draw();
		}

		function frame(now) {
			const step = Math.min((now - (previousFrame || now)) / 16.67, 2);
			previousFrame = now;
			if (state === "running") {
				if (keys.has("ArrowLeft") || keys.has("a")) paddle.x -= paddle.speed * step;
				if (keys.has("ArrowRight") || keys.has("d")) paddle.x += paddle.speed * step;
				paddle.x = Math.max(paddle.width / 2, Math.min(width - paddle.width / 2, paddle.x));
				ball.x += ball.vx * step;
				ball.y += ball.vy * step;

				if (ball.x - ball.radius < 0 || ball.x + ball.radius > width) {
					ball.vx *= -1;
					ball.x = Math.max(ball.radius, Math.min(width - ball.radius, ball.x));
				}
				if (ball.y - ball.radius < 0) {
					ball.vy = Math.abs(ball.vy);
					ball.y = ball.radius;
				}
				const hitsPaddle = ball.vy > 0 && ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height && Math.abs(ball.x - paddle.x) <= paddle.width / 2 + ball.radius;
				if (hitsPaddle) {
					const offset = (ball.x - paddle.x) / (paddle.width / 2);
					ball.vy = -Math.max(4.2, Math.abs(ball.vy));
					ball.vx = Math.max(-6, Math.min(6, ball.vx + offset * 2.4));
					ball.y = paddle.y - ball.radius;
				}
				if (ball.y - ball.radius > height) end();
				else {
					score = Math.floor((now - startedAt) / 100);
					scoreText.textContent = score;
				}
			}
			draw();
			requestAnimationFrame(frame);
		}

		playButton.addEventListener("click", () => {
			if (state === "running") {
				state = "paused";
				playButton.textContent = "Resume";
				statusText.textContent = "Take a breather.";
				draw();
			} else begin();
		});
		document.querySelector("#reset").addEventListener("click", reset);
		board.addEventListener("pointermove", event => movePaddle(event.clientX));
		board.addEventListener("pointerdown", event => {
			movePaddle(event.clientX);
			if (state === "ready" || state === "over") begin();
		});
		window.addEventListener("keydown", event => {
			const key = event.key.toLowerCase();
			if (["arrowleft", "arrowright", " "].includes(key)) event.preventDefault();
			keys.add(key);
			if (key === " " && state !== "running") begin();
		});
		window.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
		window.addEventListener("blur", () => keys.clear());
		window.addEventListener("resize", resize);
		resize();
		requestAnimationFrame(frame);
	</script>
</body>
</html>
